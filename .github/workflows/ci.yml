name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bingoplus
          POSTGRES_PASSWORD: bingoplus_dev
          POSTGRES_DB: bingoplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingoplus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bingoplus:bingoplus_dev@localhost:5432/bingoplus?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/api
      - run: npm run prisma:generate --workspace=apps/api
      - run: npm run prisma:deploy --workspace=apps/api
      - run: npm run test --workspace=apps/api
      - run: npm run test:e2e --workspace=apps/api

  web-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, customer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/${{ matrix.app }}
      - run: npm run build --workspace=apps/${{ matrix.app }}
